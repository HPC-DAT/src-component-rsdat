---
# Directory JupyterLab opens in
rsdat_jupyterlab_root_dir: "{{ rsdat_home }}"

# --- Dask workers on Slurm (defaults for the Dask extension's "New" cluster button and for
# dask_jobqueue.SLURMCluster() in notebooks; both can be overridden per cluster) ---
# Python on the Slurm cluster with the SAME dask/distributed version as rsdat_dask_version. Required.
rsdat_dask_worker_python: ""
# Shell lines run in the worker job before the worker starts (e.g. module load, source venv)
rsdat_dask_job_script_prologue: []
rsdat_dask_queue: ""        # Slurm partition
rsdat_dask_account: ""      # Slurm account (budget)
rsdat_dask_cores: 1         # cores per job
rsdat_dask_processes: 1     # worker processes per job
rsdat_dask_memory: "4GiB"   # memory per job
rsdat_dask_walltime: "01:00:00"
# Extra #SBATCH directives, e.g. ["--constraint=a100"]
rsdat_dask_job_extra_directives: []
# Directory ON THE CLUSTER for worker job logs ("" = job's working directory)
rsdat_dask_log_directory: ""
# Working directory of the worker jobs on the cluster ("" = home of the Slurm user)
rsdat_dask_job_directory: ""

# Scheduler (runs in JupyterLab on this workspace). Workers on the cluster must be able to
# reach rsdat_dask_contact_host:rsdat_dask_scheduler_port, and the scheduler must be able to
# reach the workers (see README, "Networking").
rsdat_dask_scheduler_port: 8786
rsdat_dask_contact_host: "{{ rsdat_fqdn }}"
rsdat_dask_dashboard_port: 8787
