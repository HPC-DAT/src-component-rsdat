---
- name: Check Slurm access
  ansible.builtin.assert:
    that: rsdat_slurm_access in ['api', 'ssh']
    fail_msg: "rsdat_slurm_access must be 'api' or 'ssh'"

- name: Check that the Slurm REST API URL is set
  when: rsdat_slurm_access == 'api'
  ansible.builtin.assert:
    that: rsdat_slurm_api_url | length > 0
    fail_msg: "Set rsdat_slurm_api_url to the Slurm REST API of the cluster (e.g. https://slurm.snellius.surf.nl)."

# Without a token slurmrestd answers 401 (or 403): reachable, and it serves the API version the
# proxy client uses. A connection error or a 404 means a wrong URL (or no v0.0.43).
- name: Check that the Slurm REST API answers
  when: rsdat_slurm_access == 'api' and rsdat_slurm_api_check | bool
  ansible.builtin.uri:
    url: "{{ rsdat_slurm_api_url | regex_replace('/$', '') }}/slurm/v0.0.43/ping"
    status_code: [200, 401, 403]
    timeout: 20
  register: rsdat_slurm_api_ping
  failed_when: false

- name: Stop if the Slurm REST API doesn't answer
  when: rsdat_slurm_access == 'api' and rsdat_slurm_api_check | bool and rsdat_slurm_api_ping.status not in [200, 401, 403]
  ansible.builtin.fail:
    msg: >-
      The Slurm REST API at {{ rsdat_slurm_api_url }} doesn't answer as expected
      ({{ rsdat_slurm_api_ping.status | default('?') }}: {{ rsdat_slurm_api_ping.msg | default('') | truncate(200) }}).
      Check rsdat_slurm_api_url: the base URL of slurmrestd, serving API v0.0.43 (Slurm 25.05),
      reachable from this workspace. Set rsdat_slurm_api_check=false to skip this check.

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ rsdat_config_dir }}"
    - "{{ rsdat_slurm_bin }}"

- name: Slurm REST API settings for all users
  when: rsdat_slurm_access == 'api'
  ansible.builtin.template:
    src: slurm.env.j2
    dest: "{{ rsdat_config_dir }}/slurm.env"
    owner: root
    group: "{{ rsdat_user }}"
    # may contain a token: readable by the RS-DAT user only
    mode: "{{ '0640' if rsdat_slurm_jwt | length > 0 else '0644' }}"
  no_log: true

# The workspace's SSH key for the cluster (access "ssh", or the sshuttle worker route)
- name: SSH to the cluster's login node
  when: rsdat_slurm_ssh | bool
  block:
    - name: Check the SSH settings
      ansible.builtin.assert:
        that:
          - rsdat_slurm_host | length > 0
          - rsdat_slurm_user | length > 0
        fail_msg: >-
          Slurm access 'ssh' and the worker route 'sshuttle' log in to the cluster: set
          rsdat_slurm_host (the login node) and rsdat_slurm_user.

    - name: Install the SSH client
      ansible.builtin.apt:
        name: openssh-client
        state: present

    - name: Directories for the SSH key
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ rsdat_user }}"
        group: "{{ rsdat_user }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ rsdat_home }}/.ssh", mode: "0700"}
        - {path: "{{ rsdat_home }}/.config", mode: "0755"}
        - {path: "{{ rsdat_home }}/.config/rsdat", mode: "0700"}
        - {path: "{{ rsdat_slurm_ssh_dir }}", mode: "0700"}

    - name: SSH key for the cluster
      ansible.builtin.command:
        cmd: ssh-keygen -q -t ed25519 -N "" -C rsdat-slurm@{{ rsdat_fqdn }} -f {{ rsdat_slurm_ssh_dir }}/id_ed25519
        creates: "{{ rsdat_slurm_ssh_dir }}/id_ed25519"

    - name: SSH key owned by the RS-DAT user
      ansible.builtin.file:
        path: "{{ rsdat_slurm_ssh_dir }}/{{ item }}"
        owner: "{{ rsdat_user }}"
        group: "{{ rsdat_user }}"
        mode: "0600"
      loop: [id_ed25519, id_ed25519.pub]

    # Trust on first use, at deployment: the login node's host keys as it presents them now
    - name: Host keys of the login node
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          ssh-keyscan -T 20 {{ rsdat_slurm_host | quote }} 2>/dev/null | grep -v '^#' > known_hosts.tmp
          && test -s known_hosts.tmp && mv known_hosts.tmp known_hosts
        chdir: "{{ rsdat_slurm_ssh_dir }}"
        creates: "{{ rsdat_slurm_ssh_dir }}/known_hosts"
        executable: /bin/bash
      register: rsdat_slurm_keyscan
      failed_when: false

    - name: Stop if the login node doesn't answer
      when: rsdat_slurm_keyscan.rc | default(0) != 0
      ansible.builtin.fail:
        msg: >-
          Could not read the SSH host keys of {{ rsdat_slurm_host }} (rsdat_slurm_host): is it the
          cluster's login node, reachable from this workspace on port 22?

    # readable by root too (sshuttle runs as root); root can read it anyway
    - name: known_hosts owned by the RS-DAT user
      ansible.builtin.file:
        path: "{{ rsdat_slurm_ssh_dir }}/known_hosts"
        owner: "{{ rsdat_user }}"
        group: "{{ rsdat_user }}"
        mode: "0644"

    - name: SSH settings for the login node (host alias rsdat-slurm)
      ansible.builtin.copy:
        dest: "{{ rsdat_slurm_ssh_config }}"
        mode: "0644"
        content: |
          # Generated by Ansible (src-component-rsdat). ssh -F {{ rsdat_slurm_ssh_config }} rsdat-slurm
          Host rsdat-slurm
              HostName {{ rsdat_slurm_host }}
              User {{ rsdat_slurm_user }}
              IdentityFile {{ rsdat_slurm_ssh_dir }}/id_ed25519
              IdentitiesOnly yes
              UserKnownHostsFile {{ rsdat_slurm_ssh_dir }}/known_hosts
              StrictHostKeyChecking yes
              BatchMode yes
              ConnectTimeout 20
              ServerAliveInterval 15
              ServerAliveCountMax 4
              # one connection for all Slurm commands (squeue polls often)
              ControlMaster auto
              ControlPath ~/.ssh/rsdat-cm-%C
              ControlPersist 10m

    - name: Read the public key
      ansible.builtin.slurp:
        src: "{{ rsdat_slurm_ssh_dir }}/id_ed25519.pub"
      register: rsdat_slurm_ssh_pub

    - name: Public key to register on the cluster
      ansible.builtin.debug:
        msg:
          - "Add this public key in the SURF CUA portal (https://portal.cua.surf.nl) for {{ rsdat_slurm_user }}:"
          - "{{ rsdat_slurm_ssh_pub.content | b64decode | trim }}"

- name: Slurm command wrappers (load settings, then run the proxy command, or run it over SSH)
  ansible.builtin.template:
    src: "{{ 'slurm-ssh-wrapper.sh.j2' if rsdat_slurm_access == 'ssh' else 'slurm-wrapper.sh.j2' }}"
    dest: "{{ rsdat_slurm_bin }}/{{ item }}"
    mode: "0755"
  loop: "{{ rsdat_slurm_commands }}"

- name: Helper to store a personal Slurm token
  when: rsdat_slurm_access == 'api'
  ansible.builtin.template:
    src: rsdat-slurm-token.sh.j2
    dest: "{{ rsdat_slurm_bin }}/rsdat-slurm-token"
    mode: "0755"

- name: Put the Slurm commands on the PATH of login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/rsdat-slurm.sh
    mode: "0644"
    content: |
      # RS-DAT: Slurm commands ({{ "over SSH to " ~ rsdat_slurm_host if rsdat_slurm_access == "ssh" else "through the Slurm REST API" }})
      case ":$PATH:" in *":{{ rsdat_slurm_bin }}:"*) ;; *) export PATH="{{ rsdat_slurm_bin }}:$PATH" ;; esac

# JupyterLab terminals are login shells: greet them with the token's state (or the SSH hint)
- name: Token status in new terminals
  ansible.builtin.copy:
    dest: /etc/profile.d/rsdat-welcome.sh
    mode: "0644"
    content: |
      {% if rsdat_slurm_access == 'api' %}
      # RS-DAT: show the Slurm token's state in interactive shells (e.g. JupyterLab terminals)
      if [ -n "${PS1:-}" ] && [ -t 1 ] && [ -x {{ rsdat_slurm_bin }}/rsdat-slurm-token ]; then
          echo "RS-DAT workspace: Dask on Slurm through the Slurm REST API. Guide: ~/RS-DAT-start-here.ipynb"
          {{ rsdat_slurm_bin }}/rsdat-slurm-token --status || true
      fi
      {% else %}
      # RS-DAT: a hint in interactive shells (e.g. JupyterLab terminals)
      if [ -n "${PS1:-}" ] && [ -t 1 ]; then
          echo "RS-DAT workspace: Dask on Slurm over SSH to {{ rsdat_slurm_host }}. Guide: ~/RS-DAT-start-here.ipynb"
          echo "Check the SSH key: ssh -F {{ rsdat_slurm_ssh_config }} rsdat-slurm true"
      fi
      {% endif %}
