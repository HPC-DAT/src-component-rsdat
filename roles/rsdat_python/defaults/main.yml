# The workspace environment (/opt/rsdat/venv) is installed from a lock file with the exact
# version of every package, also indirect ones: worker-image/workspace.lock, resolved together
# with the workers' worker-image/requirements.lock (worker-image/lock.sh). Both sides run the same
# Python build (worker-image/python-version, installed by uv), so workspace and workers have
# identical Dask, serialization and Prefect versions.
rsdat_environment_lock: "{{ playbook_dir }}/worker-image/workspace.lock"
rsdat_python_version: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/worker-image/python-version') | trim }}"

# uv installs the Python build and the packages
rsdat_uv_version: "0.11.32"
rsdat_uv_dir: /opt/rsdat/uv
rsdat_python_dir: /opt/rsdat/python

# Extra packages for the notebooks only (e.g. ["xarray", "uproot"]): resolved on the workspace
# against the lock, so they can't change the versions shared with the workers. Packages the
# workers need too go in worker-image/requirements.txt (then run worker-image/lock.sh).
rsdat_extra_pip_packages: []
