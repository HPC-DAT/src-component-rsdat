---
- name: Install system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-dev
      - build-essential
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create RS-DAT user
  ansible.builtin.user:
    name: "{{ rsdat_user }}"
    home: "{{ rsdat_home }}"
    shell: /bin/bash
    create_home: true
    system: false

- name: Create directory for the Python environment
  ansible.builtin.file:
    path: "{{ rsdat_venv | dirname }}"
    state: directory
    mode: "0755"

- name: Install uv
  ansible.builtin.pip:
    name: "uv=={{ rsdat_uv_version }}"
    virtualenv: "{{ rsdat_uv_dir }}"
    virtualenv_command: /usr/bin/python3 -m venv
    umask: "0022"

- name: Python version of the OS
  ansible.builtin.command:
    cmd: /usr/bin/python3 -c 'import sys; print(sys.version.split()[0])'
  register: rsdat_os_python
  changed_when: false

# Workspace and workers run Ubuntu 24.04's Python (the worker image is built on ubuntu:24.04),
# so both have the same Python and OpenSSL
- name: Stop if the OS Python differs from the workers'
  ansible.builtin.assert:
    that: rsdat_os_python.stdout == rsdat_python_version
    fail_msg: >-
      This workspace has Python {{ rsdat_os_python.stdout }}, but the Dask workers use
      {{ rsdat_python_version }} (worker-image/python-version: Ubuntu 24.04's). Functions sent to
      the workers (cloudpickle) can break when these differ. Use Ubuntu 24.04, or build a worker
      image on this OS and set worker-image/python-version accordingly.

# Always Ubuntu's Python: "python3" on root's PATH can be another one (on SRC workspaces e.g. a
# uv-managed Python in /root/.local, which rsdat can't use)
- name: Python of the environment
  ansible.builtin.shell:
    cmd: "readlink -f {{ rsdat_venv }}/bin/python && {{ rsdat_venv }}/bin/python -c 'import sys; print(sys.version.split()[0])'"
  register: rsdat_venv_python
  changed_when: false
  failed_when: false

- name: Remove an environment with another Python version
  when: >-
    rsdat_venv_python.rc != 0 or not rsdat_venv_python.stdout_lines[0].startswith('/usr/')
    or rsdat_venv_python.stdout_lines[-1] != rsdat_python_version
  ansible.builtin.file:
    path: "{{ rsdat_venv }}"
    state: absent

# The environment must be readable for rsdat (the services) and the users, whatever umask the
# playbook runs with (SRC: 077), hence umask 022 for everything that writes into it
- name: Create the environment
  ansible.builtin.shell:
    cmd: "umask 022 && {{ rsdat_uv_dir }}/bin/uv venv --python /usr/bin/python3 {{ rsdat_venv }}"
    creates: "{{ rsdat_venv }}/bin/python"
  environment: &rsdat_uv_env
    UV_CACHE_DIR: /var/cache/rsdat-uv
    UV_PYTHON_DOWNLOADS: never
    # the system's CA certificates (also for proxies with their own CA)
    UV_SYSTEM_CERTS: "1"

- name: Lock file with the extra packages
  when: rsdat_extra_pip_packages | length > 0
  block:
    - name: Configuration directory
      ansible.builtin.file:
        path: "{{ rsdat_config_dir }}"
        state: directory
        mode: "0755"

    - name: Resolve the extra packages against the lock
      ansible.builtin.shell:
        cmd: >-
          printf '%s\n' {{ rsdat_extra_pip_packages | map('quote') | join(' ') }} |
          {{ rsdat_uv_dir }}/bin/uv pip compile --quiet --no-header --python {{ rsdat_venv }}/bin/python
          {{ rsdat_environment_lock | quote }} - -c {{ rsdat_environment_lock | quote }}
          -o {{ rsdat_config_dir }}/environment.lock.new
      environment: *rsdat_uv_env
      changed_when: false

    - name: Keep the resolved lock file
      ansible.builtin.copy:
        src: "{{ rsdat_config_dir }}/environment.lock.new"
        dest: "{{ rsdat_config_dir }}/environment.lock"
        remote_src: true
        mode: "0644"

- name: Install the environment from the lock file (exact versions, nothing else)
  ansible.builtin.shell:
    cmd: >-
      umask 022 && {{ rsdat_uv_dir }}/bin/uv pip sync --python {{ rsdat_venv }}/bin/python
      {{ (rsdat_config_dir ~ '/environment.lock') if rsdat_extra_pip_packages | length > 0
         else rsdat_environment_lock }}
  environment: *rsdat_uv_env
  register: rsdat_sync
  changed_when: "'Installed' in rsdat_sync.stderr or 'Uninstalled' in rsdat_sync.stderr"

# also repairs an environment installed with a stricter umask by an earlier version
- name: Make the environment readable for the services and users
  ansible.builtin.shell:
    cmd: >-
      if [ -n "$(find {{ rsdat_venv }} {{ rsdat_uv_dir }} \( ! -perm -o+r -o \( -type d ! -perm -o+x \) \) -print -quit)" ];
      then chmod -R go+rX {{ rsdat_venv }} {{ rsdat_uv_dir }} && echo fixed; fi
  register: rsdat_venv_perms
  changed_when: "'fixed' in rsdat_venv_perms.stdout"
