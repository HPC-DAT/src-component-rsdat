---
- name: Install system packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-dev
      - build-essential
      - git
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create RS-DAT user
  ansible.builtin.user:
    name: "{{ rsdat_user }}"
    home: "{{ rsdat_home }}"
    shell: /bin/bash
    create_home: true
    system: false

- name: Create directory for the Python environment
  ansible.builtin.file:
    path: "{{ rsdat_venv | dirname }}"
    state: directory
    mode: "0755"

# Always Ubuntu's Python: "python3" on root's PATH can be another one (on SRC workspaces e.g. a
# uv-managed Python in /root/.local, which rsdat can't use). An environment made from another
# Python (by an earlier version of this component) is made again.
- name: Python of the environment
  ansible.builtin.command:
    cmd: "readlink -f {{ rsdat_venv }}/bin/python"
  register: rsdat_venv_interpreter
  changed_when: false
  failed_when: false

- name: Remove an environment made from another Python
  when: rsdat_venv_interpreter.rc == 0 and not rsdat_venv_interpreter.stdout.startswith('/usr/')
  ansible.builtin.file:
    path: "{{ rsdat_venv }}"
    state: absent

# The environment must be readable for rsdat (the services) and the users, whatever umask the
# playbook runs with (SRC: 077), hence umask 022 for everything that writes into it
- name: Create virtual environment
  ansible.builtin.shell:
    cmd: "umask 022 && /usr/bin/python3 -m venv {{ rsdat_venv }}"
    creates: "{{ rsdat_venv }}/bin/python"

- name: Check the Python version of the environment
  ansible.builtin.command:
    cmd: "{{ rsdat_venv }}/bin/python -c 'import sys; print(\"%d.%d\" % sys.version_info[:2])'"
  register: rsdat_venv_python
  changed_when: false

- name: Stop if the workspace Python differs from the workers'
  ansible.builtin.assert:
    that: rsdat_venv_python.stdout == rsdat_dask_python_version
    fail_msg: >-
      The workspace environment uses Python {{ rsdat_venv_python.stdout }}, but the Dask workers
      use {{ rsdat_dask_python_version }} (rsdat_dask_python_version / worker-image/worker.def).
      Functions sent to the workers (cloudpickle) break when these differ. Use Ubuntu 24.04
      (Python 3.12), or build a worker image with this Python version and set
      rsdat_dask_python_version accordingly.

- name: Upgrade pip
  ansible.builtin.pip:
    name: pip
    state: latest  # noqa package-latest
    virtualenv: "{{ rsdat_venv }}"
    umask: "0022"

- name: Packages shared with the Dask workers (same versions as the worker image)
  ansible.builtin.pip:
    virtualenv: "{{ rsdat_venv }}"
    umask: "0022"
    requirements: "{{ rsdat_shared_requirements }}"

- name: Install RS-DAT Python packages
  ansible.builtin.pip:
    virtualenv: "{{ rsdat_venv }}"
    umask: "0022"
    name:
      - bokeh  # Dask dashboard
      - "dask-jobqueue=={{ rsdat_dask_jobqueue_version }}"
      - "jupyterlab=={{ rsdat_jupyterlab_version }}"
      - "dask-labextension=={{ rsdat_dask_labextension_version }}"
      - "jupyterlab-git=={{ rsdat_jupyterlab_git_version }}"
      - jupyter-server-proxy
      - "prefect=={{ rsdat_prefect_version }}"
      - "{{ rsdat_slurm_proxy_pip_spec }}"
    # keep the shared versions: fail rather than upgrade them
    extra_args: "-c {{ rsdat_shared_requirements }}"

- name: Install extra Python packages
  when: rsdat_extra_pip_packages | length > 0
  ansible.builtin.pip:
    virtualenv: "{{ rsdat_venv }}"
    umask: "0022"
    name: "{{ rsdat_extra_pip_packages }}"
    extra_args: "-c {{ rsdat_shared_requirements }}"

# also repairs an environment installed with a stricter umask by an earlier version
- name: Make the environment readable for the services and users
  ansible.builtin.shell:
    cmd: >-
      if [ -n "$(find {{ rsdat_venv }} \( ! -perm -o+r -o \( -type d ! -perm -o+x \) \) -print -quit)" ];
      then chmod -R go+rX {{ rsdat_venv }} && echo fixed; fi
  register: rsdat_venv_perms
  changed_when: "'fixed' in rsdat_venv_perms.stdout"
