---
- name: Stop if the Prefect API would be reachable without a password
  ansible.builtin.assert:
    that: rsdat_prefect_api_auth | bool or (rsdat_nginx_enabled | bool and rsdat_prefect_listen == '127.0.0.1')
    fail_msg: "Without nginx the Prefect server listens on all interfaces: keep rsdat_prefect_api_auth on."

- name: Prefect API password
  when: rsdat_prefect_api_auth | bool
  ansible.builtin.set_fact:
    rsdat_prefect_password: >-
      {{ lookup('ansible.builtin.password', rsdat_config_dir ~ '/prefect-api-password',
                chars=['ascii_letters', 'digits'], length=32) }}
  no_log: true

- name: Prefect API password file readable by root only
  when: rsdat_prefect_api_auth | bool
  ansible.builtin.file:
    path: "{{ rsdat_config_dir }}/prefect-api-password"
    owner: root
    group: root
    mode: "0600"

# server side: the auth string the API requires; client side (JupyterLab, its terminals and
# kernels): API URL and auth string. Group rsdat, like slurm.env.
- name: Prefect server settings
  ansible.builtin.copy:
    dest: "{{ rsdat_config_dir }}/prefect-server.env"
    owner: root
    group: "{{ rsdat_user }}"
    mode: "0640"
    content: |
      # Generated by Ansible (src-component-rsdat).
      {% if rsdat_prefect_api_auth | bool %}
      PREFECT_SERVER_API_AUTH_STRING={{ rsdat_user }}:{{ rsdat_prefect_password }}
      {% endif %}
  no_log: true
  notify: Restart Prefect

- name: Prefect client settings for JupyterLab
  ansible.builtin.copy:
    dest: "{{ rsdat_config_dir }}/prefect-client.env"
    owner: root
    group: "{{ rsdat_user }}"
    mode: "0640"
    content: |
      # Generated by Ansible (src-component-rsdat).
      PREFECT_API_URL={{ rsdat_prefect_api_url }}
      {% if rsdat_prefect_api_auth | bool %}
      PREFECT_API_AUTH_STRING={{ rsdat_user }}:{{ rsdat_prefect_password }}
      {% endif %}
  no_log: true
  notify: Restart JupyterLab

- name: Resolve the workspace's public name locally
  when:
    - rsdat_fqdn_resolve_locally | bool
    - rsdat_fqdn != 'localhost'
    - rsdat_fqdn is not match('^[0-9.]+$')
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '# rsdat: own name$'
    line: "127.0.0.1 {{ rsdat_fqdn }} # rsdat: own name"

- name: Prefect server service
  ansible.builtin.template:
    src: rsdat-prefect.service.j2
    dest: /etc/systemd/system/rsdat-prefect.service
    mode: "0644"
  notify: Restart Prefect

- name: Enable and start Prefect server
  ansible.builtin.systemd:
    name: rsdat-prefect
    enabled: true
    state: started
    daemon_reload: true
