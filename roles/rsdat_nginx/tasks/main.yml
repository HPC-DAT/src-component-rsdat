---
# SRC-Nginx (the standard Research Cloud nginx component) must run before this component.
# It terminates TLS, does the SRAM login (/validate) and includes app-location-conf.d/*.conf.
- name: Check for SRC-Nginx
  ansible.builtin.stat:
    path: "{{ rsdat_nginx_app_config_dir }}"
  register: rsdat_src_nginx

- name: Stop if SRC-Nginx is missing
  ansible.builtin.fail:
    msg: "SRC-Nginx is not installed ({{ rsdat_nginx_app_config_dir }} missing): add the SRC-Nginx component before this one."
  when: not rsdat_src_nginx.stat.exists

- name: Nginx locations for JupyterLab and Prefect
  ansible.builtin.template:
    src: rsdat.conf.j2
    dest: "{{ rsdat_nginx_app_config_dir }}/rsdat.conf"
    owner: root
    group: www-data
    mode: "0640"
  notify: Reload nginx

- name: Redirect / to JupyterLab
  ansible.builtin.copy:
    dest: "{{ rsdat_nginx_app_config_dir }}/rsdat-root.conf"
    content: |
      # Generated by Ansible (src-component-rsdat). Included by SRC-Nginx.
      location = / {
          return 302 {{ rsdat_jupyterlab_path }};
      }
    owner: root
    group: www-data
    mode: "0640"
  when: rsdat_nginx_root_redirect | bool
  notify: Reload nginx

- name: No redirect of /
  ansible.builtin.file:
    path: "{{ rsdat_nginx_app_config_dir }}/rsdat-root.conf"
    state: absent
  when: not rsdat_nginx_root_redirect | bool
  notify: Reload nginx

- name: Check the nginx configuration
  ansible.builtin.command: nginx -t
  register: rsdat_nginx_test
  changed_when: false
  failed_when: false

# e.g. another component already serves '/' (duplicate location): keep nginx working without it
- name: Leave out the redirect of / when nginx doesn't accept it
  when: rsdat_nginx_test.rc != 0 and rsdat_nginx_root_redirect | bool
  block:
    - name: Remove the redirect of /
      ansible.builtin.file:
        path: "{{ rsdat_nginx_app_config_dir }}/rsdat-root.conf"
        state: absent
      notify: Reload nginx

    - name: Report it
      ansible.builtin.debug:
        msg: "nginx doesn't accept the redirect of / (left out): {{ rsdat_nginx_test.stderr }}"

    - name: Stop if the nginx configuration is invalid without it too
      ansible.builtin.command: nginx -t
      changed_when: false

- name: Stop if the nginx configuration is invalid
  ansible.builtin.fail:
    msg: "nginx -t fails: {{ rsdat_nginx_test.stderr }}"
  when: rsdat_nginx_test.rc != 0 and not rsdat_nginx_root_redirect | bool
