---
# Shared settings for all roles. Each can be passed as a Research Cloud component parameter
# (extra var). Role-specific settings are in roles/<role>/defaults/main.yml.

# Host name users reach the workspace by; also the default host Dask workers use to reach the
# scheduler. Research Cloud passes the workspace's public name as 'workspace_fqdn'
# (e.g. daskprefectsrv.advisorssrcdemo.src.surf-hosted.nl). Set rsdat_fqdn to override;
# without either, the VM's own FQDN is used (may be an internal name).
rsdat_fqdn: "{{ workspace_fqdn | default(ansible_facts['fqdn'], true) }}"

# Unix user that runs JupyterLab and Prefect (created if missing). All CO members share this
# JupyterLab; access is controlled by SRAM in SRC-Nginx.
rsdat_user: rsdat
rsdat_home: "/home/{{ rsdat_user }}"

# Python environment with all RS-DAT software
rsdat_venv: /opt/rsdat/venv
# Wrappers for the Slurm commands (sbatch, squeue, ...) that go through the REST API
rsdat_slurm_bin: /opt/rsdat/slurm-bin
rsdat_config_dir: /etc/rsdat

# Publish JupyterLab and Prefect through SRC-Nginx (SRAM login). false is for testing on a VM
# without SRC-Nginx only: both then listen on 127.0.0.1 and are reached through an SSH tunnel.
rsdat_nginx_enabled: true

# URL paths behind SRC-Nginx
rsdat_jupyterlab_path: /jupyter/
rsdat_prefect_path: /prefect/
# The Prefect API for machines (notebooks, Dask workers): Prefect's password, no SRAM login.
# People use the UI at rsdat_prefect_path (SRAM login; nginx adds the password).
rsdat_prefect_machine_path: "{{ rsdat_prefect_path }}machine-api/"

# Local ports (bound to 127.0.0.1; nginx proxies to them)
rsdat_jupyterlab_port: 8888
rsdat_prefect_port: 4200
rsdat_prefect_enabled: true

# Prefect API password (Prefect's basic auth, user "rsdat"; generated, in
# {{ rsdat_config_dir }}/prefect-api-password). Needed because the API is reachable from the
# cluster: with prefect_dask.DaskTaskRunner the tasks run on the Dask workers and report to it.
rsdat_prefect_api_auth: true
# URL of the Prefect API for notebooks and, through them, the Dask workers (Prefect passes the
# flow's settings to the tasks): must work from the workspace and from the compute nodes.
# With SRC-Nginx: https://<workspace>/prefect/machine-api (password, no SRAM login). Without
# (testing): the server's own port on the workspace's public name, so the port must be open to
# the compute nodes (plain HTTP).
rsdat_prefect_api_url: >-
  {{ ('https://' ~ rsdat_fqdn ~ rsdat_prefect_machine_path | regex_replace('/$', '')) if rsdat_nginx_enabled | bool
     else ('http://' ~ rsdat_fqdn ~ ':' ~ rsdat_prefect_port | string ~ '/api') }}
# Address the Prefect server listens on: behind nginx 127.0.0.1, without nginx all interfaces
rsdat_prefect_listen: "{{ '127.0.0.1' if rsdat_nginx_enabled | bool else '0.0.0.0' }}"
# Resolve rsdat_fqdn to 127.0.0.1 on the workspace itself (/etc/hosts), so notebooks reach the
# Prefect API by its public name even where the VM can't reach its own public IP (OpenStack
# floating IPs often can't). Only affects processes on the workspace.
rsdat_fqdn_resolve_locally: true
