---
# Shared settings for all roles. Each can be passed as a Research Cloud component parameter
# (extra var). Role-specific settings are in roles/<role>/defaults/main.yml.

# Host name users reach the workspace by; also the default host Dask workers use to reach the
# scheduler. Research Cloud passes the workspace's public name as 'workspace_fqdn'
# (e.g. daskprefectsrv.advisorssrcdemo.src.surf-hosted.nl). Set rsdat_fqdn to override;
# without either, the VM's own FQDN is used (may be an internal name).
rsdat_fqdn: "{{ workspace_fqdn | default(ansible_facts['fqdn'], true) }}"

# Unix user that runs JupyterLab and Prefect (created if missing). All CO members share this
# JupyterLab; access is controlled by SRAM in SRC-Nginx.
rsdat_user: rsdat
rsdat_home: "/home/{{ rsdat_user }}"

# Python environment with all RS-DAT software
rsdat_venv: /opt/rsdat/venv
# Wrappers for the Slurm commands (sbatch, squeue, ...) that go through the REST API
rsdat_slurm_bin: /opt/rsdat/slurm-bin
rsdat_config_dir: /etc/rsdat

# Publish JupyterLab and Prefect through SRC-Nginx (SRAM login). false is for testing on a VM
# without SRC-Nginx only: both then listen on 127.0.0.1 and are reached through an SSH tunnel.
rsdat_nginx_enabled: true

# URL paths behind SRC-Nginx
rsdat_jupyterlab_path: /jupyter/
rsdat_prefect_path: /prefect/

# Local ports (bound to 127.0.0.1; nginx proxies to them)
rsdat_jupyterlab_port: 8888
rsdat_prefect_port: 4200
rsdat_prefect_enabled: true

# Prefect API password (Prefect's basic auth, user "rsdat"; generated, in
# {{ rsdat_config_dir }}/prefect-api-password). Needed because the API is reachable from the
# cluster: with prefect_dask.DaskTaskRunner the tasks run on the Dask workers and report to it.
rsdat_prefect_api_auth: true
# URL of the Prefect API for notebooks and, through them, the Dask workers (Prefect passes the
# flow's settings to the tasks): must work from the workspace and from the compute nodes.
# With SRC-Nginx: https://<workspace>/prefect/api. Without (testing): the server's own port on
# the workspace's public name, so the port must be open to the compute nodes (plain HTTP).
rsdat_prefect_api_url: >-
  {{ ('https://' ~ rsdat_fqdn ~ rsdat_prefect_path ~ 'api') if rsdat_nginx_enabled | bool
     else ('http://' ~ rsdat_fqdn ~ ':' ~ rsdat_prefect_port | string ~ '/api') }}
# Address the Prefect server listens on: behind nginx 127.0.0.1, without nginx all interfaces
rsdat_prefect_listen: "{{ '127.0.0.1' if rsdat_nginx_enabled | bool else '0.0.0.0' }}"
# Resolve rsdat_fqdn to 127.0.0.1 on the workspace itself (/etc/hosts), so notebooks reach the
# Prefect API by its public name even where the VM can't reach its own public IP (OpenStack
# floating IPs often can't). Only affects processes on the workspace.
rsdat_fqdn_resolve_locally: true

# --- The Slurm cluster (shared by the Slurm and JupyterLab roles) ---
# How the workspace runs the Slurm commands (sbatch, squeue, scancel, ...):
# - "api": through the cluster's Slurm REST API (rsdat_slurm_api_url, SLURM-CLI-API-Proxy
#   client), with a Slurm token
# - "ssh": on the login node rsdat_slurm_host over SSH, as rsdat_slurm_user, with a key the
#   playbook generates (rsdat_slurm_ssh_dir/id_ed25519; register its .pub in the SURF CUA
#   portal, https://portal.cua.surf.nl)
rsdat_slurm_access: api
# Slurm user name. Access "api": optional, the user of the token (users can set their own token
# with 'rsdat-slurm-token'). Access "ssh" or worker route "sshuttle": the SSH login user (required).
rsdat_slurm_user: ""
# Login node for SSH (access "ssh", worker route "sshuttle"), e.g. snellius.surf.nl
rsdat_slurm_host: ""
# The workspace's SSH key and known_hosts for rsdat_slurm_host
rsdat_slurm_ssh_dir: "{{ rsdat_home }}/.config/rsdat/slurm-ssh"
rsdat_slurm_ssh_config: "{{ rsdat_config_dir }}/slurm-ssh.conf"

# Where the Dask scheduler runs:
# - "workspace": in JupyterLab here. Workers connect to it on rsdat_dask_scheduler_port; how it
#   reaches the workers is set by rsdat_dask_worker_route.
# - "cluster": as a Slurm job next to the workers; it opens a reverse SSH tunnel to this
#   workspace (port rsdat_dask_tunnel_port), which notebooks connect through. Only the cluster
#   opens connections.
rsdat_dask_scheduler_location: workspace
# Scheduler on the workspace: how it reaches the workers
# - "gateway": through a small gateway job on the cluster that opens a reverse SSH tunnel to
#   this workspace (a SOCKS proxy into rsdat_dask_worker_network). For when the workspace
#   can't connect to the compute nodes (Snellius).
# - "sshuttle": through sshuttle on the workspace (a system service, as root), which routes
#   rsdat_dask_worker_network over one SSH connection to rsdat_slurm_host. Needs python3 on the
#   login node and the workspace's key registered on the cluster.
# - "direct": directly; the cluster firewall must allow the workspace to reach the workers.
rsdat_dask_worker_route: gateway

# Derived: sshuttle in use, and the workspace's SSH key for the cluster needed
rsdat_dask_sshuttle: "{{ rsdat_dask_scheduler_location == 'workspace' and rsdat_dask_worker_route == 'sshuttle' }}"
rsdat_slurm_ssh: "{{ rsdat_slurm_access == 'ssh' or rsdat_dask_sshuttle | bool }}"
