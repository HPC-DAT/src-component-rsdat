# Build the Dask worker image (worker-image/worker.def) and push it to the GitHub Container
# Registry as oras://ghcr.io/<owner>/<repo>-worker:<tag>. Based on RS-DAT/JDS_development_template.
name: Worker image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - worker-image/**
      - .github/workflows/worker-image.yml
  workflow_dispatch:

jobs:
  build:
    # Pinned: Apptainer's standard .deb needs libfuse3-3, which ubuntu-latest (26.04) no
    # longer has (it ships libfuse3-4)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # workspace.lock and requirements.lock must match workspace.in / requirements.txt /
      # python-version: resolve again and compare (versions that still fit are kept)
      - name: Check the lock files are up to date
        run: |
          pip install --quiet uv==0.11.32
          worker-image/lock.sh
          git diff --exit-code worker-image/ || { echo "Run worker-image/lock.sh and commit the lock files"; exit 1; }

      - name: Set up Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5

      - name: Build image
        run: apptainer build worker.sif worker-image/worker.def

      # the image has the workspace's Python build and exactly the locked packages
      - name: Check the image's Python and packages
        run: |
          apptainer exec worker.sif python -c "import sys, dask, distributed; print(sys.version); print(dask.__version__, distributed.__version__)"
          test "$(apptainer exec worker.sif python -c 'import sys; print(sys.version.split()[0])')" = "$(cat worker-image/python-version)"
          apptainer exec worker.sif uv pip freeze --python /opt/venv/bin/python > image-freeze.txt
          grep -oE '^[A-Za-z0-9_.-]+==[^ \\]+' worker-image/requirements.lock | sort -f > locked.txt
          grep -oE '^[A-Za-z0-9_.-]+==[^ ]+' image-freeze.txt | sort -f > installed.txt
          diff -i locked.txt installed.txt

      # registry names must be lower case
      - name: Image name
        run: |
          echo "IMAGE=oras://ghcr.io/${GITHUB_REPOSITORY,,}-worker" >> "$GITHUB_ENV"
          echo "DASK_VERSION=$(sed -nE 's/^dask==(.+)/\1/p' worker-image/requirements.txt)" >> "$GITHUB_ENV"
          # the tag the playbook looks for by default (rsdat_jupyterlab: "Hash of the worker image definition")
          echo "DEF_HASH=$(cat worker-image/requirements.lock worker-image/python-version worker-image/worker.def | sha256sum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Push to ghcr.io
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer remote login -u "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push worker.sif "${IMAGE}:${DASK_VERSION}"
          apptainer push worker.sif "${IMAGE}:${GITHUB_SHA::7}"
          apptainer push worker.sif "${IMAGE}:req-${DEF_HASH}"
          apptainer push worker.sif "${IMAGE}:latest"
